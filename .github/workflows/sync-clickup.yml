name: Sincronizar com ClickUp

on:
  schedule:
    # Backup, só para o caso da VM cair -- o driver principal agora é o
    # cron de 5 em 5 minutos rodando na VM (ver deploy/sync-cron.sh).
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Sincronizar dados do ClickUp (data/neugebauer.json)
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          CLICKUP_LIST_ID: "901328018187"
        run: python scripts/sync_clickup.py

      - name: Reconstruir o painel (index.html)
        run: python scripts/build.py

      - name: Publicar alterações (se houver)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/neugebauer.json index.html
          # IMPORTANTE: NUNCA usar "[skip ci]" na mensagem de commit --
          # o Cloudflare Pages também respeita essa tag e pula o build,
          # deixando o site publicado desatualizado mesmo com o GitHub
          # certo. Este workflow só roda por agendamento/manual (nunca
          # por push), então não há risco de loop mesmo sem o [skip ci].
          git diff --cached --quiet && echo "Nada para commitar" || git commit -m "Sincronização automática com ClickUp"
          git push
