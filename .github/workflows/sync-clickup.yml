name: Sincronizar com ClickUp

on:
  schedule:
    # De hora em hora, no minuto 23.
    #
    # NÃO use o minuto :00 aqui. O GitHub concentra milhões de crons nesse
    # minuto e descarta os excedentes sob carga -- com "0 * * * *" este
    # repositório estava rodando só ~3x por dia em vez de 24x (medido em
    # 26/08: execuções às 16:18, 19:04 e 22:50, e depois 8h de silêncio).
    # Minutos fora de pico são bem mais confiáveis.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só simular: publica numa branch de teste, sem mexer no painel"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar acesso ao ClickUp
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
        run: |
          CODE=$(curl -s -o /tmp/cu.json -w "%{http_code}" \
            -H "Authorization: $CLICKUP_TOKEN" \
            "https://api.clickup.com/api/v2/list/901328018187/task?page=0")
          if [ "$CODE" != "200" ]; then
            echo "::error::ClickUp respondeu HTTP $CODE. Resposta: $(head -c 200 /tmp/cu.json)"
            {
              echo "gerado em: $(date -u)"
              echo "HTTP: $CODE"
              echo "prefixo do token: ${CLICKUP_TOKEN:0:11} (tamanho ${#CLICKUP_TOKEN})"
              echo "resposta:"; head -c 300 /tmp/cu.json
            } > DIAGNOSTICO.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add DIAGNOSTICO.txt && git commit -m "diagnóstico" && git push || true
            echo "Se for 401 'Token invalid', o token foi revogado/regenerado."
            echo "Gere outro em app.clickup.com/3080406/settings/apps e atualize o secret CLICKUP_TOKEN."
            exit 1
          fi
          echo "Acesso ao ClickUp OK (HTTP 200)."

      - name: Sincronizar dados do ClickUp
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          CLICKUP_LIST_ID: "901328018187"
        run: python scripts/sync_clickup.py

      - name: Reconstruir o painel
        run: python scripts/build.py

      - name: Rodar testes
        run: python tests/test_sync.py

      - name: Publicar alterações (se houver)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/neugebauer.json index.html
          # NUNCA usar [skip ci]: o Cloudflare Pages também respeita essa tag
          # e pularia o rebuild, deixando o site publicado desatualizado.
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            # Simulação: manda para uma branch descartável, o painel publicado
            # (main) não é tocado.
            git diff --cached --quiet && echo "Nada mudou." || (
              git commit -m "PRÉVIA (não publicado)" &&
              git push -f origin HEAD:refs/heads/previa-sync
            )
            echo "Modo simulação: nada foi publicado em main."
          else
            git diff --cached --quiet && echo "Nada mudou." || (git commit -m "Sincronização automática com ClickUp" && git push)
          fi
