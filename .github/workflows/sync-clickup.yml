name: Sincronizar com ClickUp

on:
  # AGENDAMENTO DESATIVADO em 27/08/2026.
  #
  # Motivo: o painel passou a ser o HTML novo (publicado direto em
  # index.html). Este workflow reconstrói o index.html a partir do
  # template ANTIGO (legado/templates/base.html) e commita por cima --
  # ou seja, se voltar a rodar, ele APAGA o painel novo.
  #
  # Os scripts antigos foram movidos para legado/ e o gatilho automático
  # foi removido de propósito. Para religar a automação é preciso antes
  # reescrever o build.py para gerar o layout novo.
  #
  # schedule:
  #   - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Sincronizar dados do ClickUp (data/neugebauer.json)
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          CLICKUP_LIST_ID: "901328018187"
        run: python legado/scripts/sync_clickup.py

      - name: Reconstruir o painel (index.html)
        run: python legado/scripts/build.py

      - name: Publicar alterações (se houver)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add legado/data/neugebauer.json
          # IMPORTANTE: NUNCA usar "[skip ci]" na mensagem de commit --
          # o Cloudflare Pages também respeita essa tag e pula o build,
          # deixando o site publicado desatualizado mesmo com o GitHub
          # certo. Este workflow só roda por agendamento/manual (nunca
          # por push), então não há risco de loop mesmo sem o [skip ci].
          git diff --cached --quiet && echo "Nada para commitar" || git commit -m "Sincronização automática com ClickUp"
          git push
