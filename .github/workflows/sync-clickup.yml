name: Sincronizar com ClickUp

on:
  schedule:
    # De hora em hora, no minuto 23.
    #
    # NÃO use o minuto :00 aqui. O GitHub concentra milhões de crons nesse
    # minuto e descarta os excedentes sob carga -- com "0 * * * *" este
    # repositório estava rodando só ~3x por dia em vez de 24x (medido em
    # 26/08: execuções às 16:18, 19:04 e 22:50, e depois 8h de silêncio).
    # Minutos fora de pico são bem mais confiáveis.
    - cron: "23 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Diagnóstico do acesso ao ClickUp
        if: always()
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
        run: |
          {
            echo "gerado em: $(date -u)"
            if [ -z "$CLICKUP_TOKEN" ]; then
              echo "secret CLICKUP_TOKEN: VAZIO/AUSENTE"
            else
              echo "secret CLICKUP_TOKEN: presente (tamanho ${#CLICKUP_TOKEN}, prefixo ${CLICKUP_TOKEN:0:11})"
            fi
            CODE=$(curl -s -o /tmp/cu.json -w "%{http_code}" \
              -H "Authorization: $CLICKUP_TOKEN" \
              "https://api.clickup.com/api/v2/list/901328018187/task?page=0")
            echo "HTTP: $CODE"
            echo "resposta (400 chars):"
            head -c 400 /tmp/cu.json
          } > DIAGNOSTICO.txt 2>&1
          cat DIAGNOSTICO.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DIAGNOSTICO.txt
          git commit -m "diagnóstico automático" || true
          git push || true

      - name: Sincronizar dados do ClickUp
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          CLICKUP_LIST_ID: "901328018187"
        run: python scripts/sync_clickup.py

      - name: Reconstruir o painel
        run: python scripts/build.py

      - name: Rodar testes
        run: python tests/test_sync.py

      - name: Publicar alterações (se houver)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/neugebauer.json index.html
          # NUNCA usar [skip ci]: o Cloudflare Pages também respeita essa tag
          # e pularia o rebuild, deixando o site publicado desatualizado.
          git diff --cached --quiet && echo "Nada mudou." || (git commit -m "Sincronização automática com ClickUp" && git push)
